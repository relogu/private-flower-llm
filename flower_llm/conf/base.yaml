---
run_uuid: chiappe
seed: 1337
is_test: false
pretrained_model_path: null

centralized:
  store_init_model: false
  store_final_model: false
  stream_id: null

# Pollen specific settings
pollen:
  placement_policy: rr # "rr", "srr", "bu", "su", "lbu", "lb", "llb"
  n_nodes: 1
  refresh_period: 50
  fit_collaborative: false
  eval_collaborative: true
  cpu_only: false
  cpu_concurrency: 1
  checkpoint: false
  # Set to null to only restore from the current run
  restore_run_uuid: null
  resume_round: -1

fl:
  n_total_clients: 8
  n_clients_per_round: 8
  n_rounds: 200
  reset_optimizer: true
  n_local_epochs: 1
  n_local_steps: 0
  rescale_global_model: false
  rescale_momentum_vector: false
  server_learning_rate: 0.7
  server_momentum: 0.7

# Defaults
defaults:
  - base_schema
  - _self_
  - llm_config: mpt-125m
  - dataset: fed-c4-c4
  - dataset/streams@dataset.train.streams: 8_clients
  - dataset/streams@dataset.val.streams: centralised

# S3 communication stack
use_s3_comm: false

s3_comm_config:
  bucket_name: checkpoints
  num_attempts: 3
  backend_kwargs:
    client_config:
      connect_timeout: 3600
      read_timeout: 3600

# Weights&Biases
use_wandb: true

wandb:
  setup:
    project: pollen-llm
    group: llm
    tags:
      - run_uuid_${run_uuid}
      # - learning_rate_${task.learning_rate}
      # - local_epochs_${local_epochs}
      # - batch_size_${task.batch_size}
    entity: null
    mode: online
    name: ${run_uuid}
    resume: allow
    id: ${run_uuid}
    allow_val_change: true
