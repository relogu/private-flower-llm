[build-system]
requires = ["poetry-core>=1.4.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flower_llm"
version = "0.2.3"
description = "FlowerLLM: federated generative pre-training of large language models using Flower and Pollen."
license = "Apache-2.0"
authors = ["Lorenzo Sani <ls985@cam.ac.uk>", "Alexandru-Andrei Iacob <aai30@cam.ac.uk>"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]


[tool.poetry.dependencies]
python = ">=3.11, <3.12"  # don't change this
hydra-core = "1.3.2" # don't change this
types-protobuf = "^4.24.0.1"
types-pyyaml = "^6.0.12.12"
types-decorator = "^5.1.8.4"
types-setuptools = "^68.2.0.0"
wandb = "^0.16.1"
pyarrow = "^14.0.1"
multiprocess = "^0.70.15"
nvsmi = "^0.4.2"
transformers = ">=4.40,<4.41"
cloudpickle = "^3.0.0"
tqdm = "^4.66.1"
psutil = "^5.9.5"
pandas = "^2.1.1"
scipy = ">=1.10.0,<=1.11.0"
librosa = "^0.10.1"
flwr = {extras = ["simulation"], version = "1.7.0"}
nvidia-ml-py = "11.495.46"
sentencepiece = "0.1.97"
ipykernel = "^6.25.2"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
jupyter-server = "^2.7.3"
ipywidgets = "^8.1.1"
ipython = "^8.17.2"
torch = {url = "https://download.pytorch.org/whl/cu121/torch-2.3.0%2Bcu121-cp311-cp311-linux_x86_64.whl#sha256=5df7e3cb3961018a891e4edef1e0bc1f3304a8d943f81b24a8c6bf687ca49a67"}
torchaudio = {url = "https://download.pytorch.org/whl/cu121/torchaudio-2.3.0%2Bcu121-cp311-cp311-linux_x86_64.whl#sha256=8dd66913e7b08c63c76b21b0706130c24aee4ed4adc0bc12f8d62df98b5c6ea0"}
torchvision = {url = "https://download.pytorch.org/whl/cu121/torchvision-0.18.0%2Bcu121-cp311-cp311-linux_x86_64.whl#sha256=1e516779520fc92157d6cb245ac0fd3f79872fe81c84b8593a8f2e998106f5b1"}
mosaicml = { git = "https://github.com/relogu/composer.git", tag = "dodo_v0.2.2", extras = ["libcloud,wandb,mlflow,oci,gcs,tensorboard"] }
accelerate = ">=0.25,<0.26"
mosaicml-streaming = { git = "https://github.com/relogu/streaming.git", tag = "dodo_v0.2.0" }
datasets = ">=2.19,<2.20"
fsspec = "2023.6.0"
einops = "0.7.0"
omegaconf = ">=2.2.3,<3"
slack-sdk = "<4"
mosaicml-cli = ">=0.3,<1"
onnx = "1.14.0"
onnxruntime = "1.15.1"
cmake = ">=3.25.0,<=3.26.3"  # required for triton-pre-mlir below
triton-pre-mlir = { git = "https://github.com/vchiley/triton.git", branch = "triton_pre_mlir_sm90", subdirectory = "python" }
boto3 = ">=1.21.45,<2"
huggingface-hub = ">=0.17.0,<1.0"
beautifulsoup4 = ">=4.12.2,<5"  # required for model download utils
tenacity = ">=8.2.3,<9"
llm-foundry = { git = "https://github.com/relogu/llm-foundry.git", tag = "dodo_v0.2.0" }
wheel = "^0.42.0"
loralib = "0.1.1"
bitsandbytes = "0.39.1"
peft = "0.4.0"
pip = "24.1"
py3nvml = "^0.2.7"
memray = "^1.11.0"
objgraph = "^3.6.0"
minio = "^7.2.4"
watchdog = "3.0.0"
apache-libcloud = "^3.8.0"
tensorboard = "^2.16.2"
pydantic = "<2.0.0"

[tool.poetry.dev-dependencies]
isort = "^5.13.2"
black = { version = "^24.4.2", extras = ["jupyter"] }
docformatter = "^1.7.5"
mypy = "^1.11.0"
pylint = "^3.2.6"
flake8 = "==7.1.0"
pytest-watch = "==4.2.0"
ruff = "^0.6.3"
yamlfix = "^1.16.0"
pre-commit = "^3.8.0"
pytest = ">=7.2.1,<9"
pytest_codeblocks = ">=0.16.1,<0.18"
pytest-cov = ">=4,<6"
pyright = "1.1.373"
toml = ">=0.10.2,<0.11"
packaging = ">=21,<25"
hf_transfer = "0.1.8"

[tool.isort]
line_length = 88
indent = "    "
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool.black]
line-length = 88
preview = true
target-version = ["py311"]

[tool.pytest.ini_options]
minversion = "6.2"
addopts = "-qq"
testpaths = [
    "flwr_baselines",
]

[tool.mypy]
ignore_missing_imports = true
show_error_codes = true
strict = false
plugins = "numpy.typing.mypy_plugin"

[tool.pylint."MESSAGES CONTROL"]
disable = "bad-continuation,duplicate-code,too-few-public-methods,useless-import-alias,import-error,no-member,no-name-in-module"
good-names = "f,i,j,k,_,x,y,X,Y"
signature-mutators="hydra.main.main"

[[tool.mypy.overrides]]
module = [
    "importlib.metadata.*",
    "importlib_metadata.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "torch.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = "ray.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88

[tool.yamlfix]
allow_duplicate_keys = false
line_length = 88
none_representation = "null"
whitelines = 1
section_whitelines = 1
exclude = [
    ".bzr", 
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "proto",
    "outputs",
    "wandb",
    "multirun",
]


[tool.ruff]
target-version = "py311"
line-length = 88
preview = true
lint.select = ["A", "D", "E", "F", "W", "B", "ISC", "N", "ANN",
"C4", "UP", "COM", "EXE", "FA", "ISC", "ICN", "INP", "PIE", "T20", 
"Q", "RET", "SLOT", "SIM", "TID", "ARG", "PTH", "TD", "PD", "PGH", 
"PL", "TRY","NPY", "PERF", "FURB", "RUF" ]
lint.fixable = ["A", "D", "E", "F", "W", "B", "ISC", "N", "ANN", 
"C4", "UP", "COM", "EXE", "FA", "ISC", "ICN", "INP", "PIE", "T20",
"Q", "RET", "SLOT", "SIM", "TCH", "ARG", "PTH", "TD", "PD", "PGH",
"PL", "TRY", "NPY", "PERF", "FURB", "RUF"]
lint.ignore = ["B024", "B027", "PLE1205", "PLE1206", "PLR0904",
"PLR0911" , "PLR0912", "PLR0913", "PLR0915", "PLR0916", "PERF203",
"PERF401","PERF403", "ANN101", "ANN102", "ANN401", "PLR6301",
"ARG002", "TRY003", "PTH123", "TD002","TD003", "ARG001",
"ARG002", "ARG003", "ARG004", "RET505", "N812", "RET504", 
"PLW2901", "NPY002", "COM812", "ISC001", "RUF005", "PLR0917", "PLR0914"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "proto",
]

[tool.ruff.format]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"
