---
name: mpt-small-cpu
data_local: ./my-copy-c4
data_remote: null  # If blank, files must be present in data_local
max_seq_len: 128
global_seed: 17
autoresume: true

# Run Name
run_name: ${run_uuid}  # If left blank, will be read from env var $RUN_NAME

# Model
model:
  name: mpt_causal_lm
  init_device: cpu
  d_model: 16
  n_heads: 4
  n_layers: 4
  expansion_ratio: 5
  max_seq_len: ${llm_config.max_seq_len}
  vocab_size: 50368
  attn_config:
    attn_impl: torch
  loss_fn: torch_crossentropy

# Tokenizer
tokenizer:
  name: EleutherAI/gpt-neox-20b
  kwargs:
    model_max_length: ${llm_config.max_seq_len}

# Dataloaders
train_loader:
  name: text
  dataset:
    local: ${llm_config.data_local}
    remote: ${llm_config.data_remote}
    split: train
    shuffle: true
    max_seq_len: ${llm_config.max_seq_len}
    shuffle_seed: ${llm_config.global_seed}
    keep_zip: false
    cache_limit: 10gb
  drop_last: true
  num_workers: 2

eval_loader:
  name: text
  dataset:
    local: ${llm_config.data_local}
    remote: ${llm_config.data_remote}
    split: val
    shuffle: false
    max_seq_len: ${llm_config.max_seq_len}
    shuffle_seed: ${llm_config.global_seed}
    keep_zip: false
    cache_limit: 10gb
  drop_last: false
  num_workers: 2

# Optimization
scheduler:
  name: cosine_with_warmup
  t_warmup: 300ba
  alpha_f: 0.1
  t_max: 1500ba

optimizer:
  name: decoupled_adamw
  lr: 4.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-08
  weight_decay: 0.0

algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

local_steps: 512ba
max_duration: 1500ba  # ~ 134B tokens
eval_interval: 512ba
eval_first: false
eval_subset_num_batches: 5
global_train_batch_size: 256

# System
seed: ${llm_config.global_seed}
device_eval_batch_size: 16
device_train_microbatch_size: 16
# device_train_microbatch_size: auto
precision: fp32

# FSDP
fsdp_config:
  sharding_strategy: FULL_SHARD
  mixed_precision: PURE
  activation_checkpointing: false
  activation_checkpointing_reentrant: false
  activation_cpu_offload: false
  limit_all_gathers: true

# Logging
progress_bar: false
log_to_console: true
console_log_interval: 1ba

callbacks:
  speed_monitor:
    window_size: 10
    gpu_flops_available: null
  lr_monitor: {}
  memory_monitor: {}
  runtime_estimator: {}

# loggers:
#   wandb:
#     project: {}
#     name: {}

# Checkpoint to local filesystem or remote object store
save_interval: 512ba
save_num_checkpoints_to_keep: 1  # Important, this cleans up checkpoints saved to DISK
save_folder: ./{run_name}/checkpoints
# save_folder: s3://my-bucket/my-folder/{run_name}/checkpoints
save_overwrite: false

# Load from local filesystem or remote object store
# load_path: ./gpt-125m/checkpoints/latest-rank{rank}.pt
# load_path: s3://my-bucket/my-folder/gpt-125m/checkpoints/latest-rank{rank}.pt
load_path: null
