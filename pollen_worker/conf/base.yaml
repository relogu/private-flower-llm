---
run_uuid: chiappe
seed: 1337
is_test: false

# Pollen specific settings
pollen:
  placement_policy: rr # "rr", "srr", "bu", "su", "lbu", "lb", "llb"
  n_nodes: 1
  server_address: localhost:50734
  saving_path: /tmp/pollen
  refresh_period: 50
  fit_collaborative: false
  eval_collaborative: true
  checkpoint: false
  resume_round: -1

fl:
  n_total_clients: 8
  n_clients_per_round: 8
  n_rounds: 200

# Defaults
defaults:
  - _self_
  - llm_config: mpt-125m

# MinIO
use_minio_comm: false

minio:
  minio_client:
    endpoint: null
    access_key: null
    secret_key: null
    session_token: null
    secure: false
    region: null
    cert_check: false
  minio_state:
    run_uuid: ${run_uuid}
    endpoint_id: null
    bucket_name: null
    file_size: 1073741824  # = 1024 * 1024 * 1024
    throw_on_error: true
    timeout_in_seconds: 3600

# Weights&Biases
use_wandb: true

wandb:
  setup:
    project: pollen-llm
    group: llm
    tags:
      - run_uuid_${run_uuid}
      # - learning_rate_${task.learning_rate}
      # - local_epochs_${local_epochs}
      # - batch_size_${task.batch_size}
    entity: null
    mode: online
    name: ${run_uuid}
    resume: allow
    id: ${run_uuid}
    allow_val_change: true
  start_eval: 0
