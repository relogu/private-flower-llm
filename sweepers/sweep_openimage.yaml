---
project: pollen
program: ./alex_slurm_sweepers/slurm_ray_singlenode_sweep.sh
method: bayes

metric:
  goal: maximize
  name: accuracy

parameters:
  task.learning_rate:
    min: 0.0
    max: 1.0
  task.strategy.eta:
    min: 0.0
    max: 1.0
  task.strategy.tau:
    min: 0.00000001
    max: 0.01
  local_epochs:
    values: [1, 2, 3, 5, 8]

early_terminate:
  type: hyperband
  min_iter: 6
  eta: 2

command:
  - ${program}
  - use_wandb=True
  - task=openimage
  - task.num_rounds=100
  - ray_address=auto
  - ray_node_ip_address=128.232.115.66
  - ${args_no_hyphens}
